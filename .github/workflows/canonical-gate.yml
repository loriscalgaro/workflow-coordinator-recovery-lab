name: Trusted canonical gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  publish-trusted-status:
    name: publish-trusted-status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout protected base code only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate data through trusted base validator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/github_gate.py
